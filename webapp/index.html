<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Script Drop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0e0e11;
      --card-bg: #18181c;
      --card-border: #26262b;
      --text: #ffffff;
      --text-muted: #8e8e93;
      --accent: #22c55e;
      --danger: #ef4444;
      --btn-bg: #242429;
      --btn-hover: #2c2c33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 40px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-top: 4px;
    }

    .app-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .user-badge {
      font-size: 13px;
      color: var(--text-muted);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 20px;
    }

    /* Channel Banner */
    .channel-banner {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .channel-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .channel-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .btn-channel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #ffffff;
      color: #000000;
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      border-radius: 12px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-channel:active {
      opacity: 0.85;
    }

    /* Subscription Card */
    .sub-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .sub-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .sub-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sub-status {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .status-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
    }

    .status-icon.active {
      background: rgba(34, 197, 94, 0.15);
      color: var(--accent);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-icon.inactive {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .status-text h4 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .status-text p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .sub-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-sub {
      flex: 1;
      background: var(--btn-bg);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-sub:active {
      background: var(--btn-hover);
    }

    /* History Section */
    .section-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .scripts-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .script-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
    }

    .item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .item-name {
      font-size: 15px;
      font-weight: 600;
    }

    .item-badge {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .item-features {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 10px;
      white-space: pre-line;
    }

    .item-code {
      background: #09090b;
      border: 1px solid #1e1e24;
      border-radius: 8px;
      padding: 8px 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: #94a3b8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 10px;
    }

    .btn-copy {
      width: 100%;
      background: var(--btn-bg);
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      padding: 9px;
      border-radius: 9px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }

    .btn-copy:active {
      background: var(--btn-hover);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .empty-text {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #fff;
    }

    .empty-sub {
      font-size: 12px;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: #ffffff;
      color: #000000;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 1000;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="app-title">Script Drop</div>
      <div class="user-badge" id="user-display">Игрок</div>
    </div>

    <!-- Official Channel Card -->
    <div class="channel-banner">
      <div class="channel-title">Канал со скриптами</div>
      <div class="channel-desc">Свежие релизы, читы и скрипты для Roblox без вирусов и рекламы.</div>
      <a href="https://t.me/script_drop" target="_blank" class="btn-channel">
        Перейти в @script_drop ↗
      </a>
    </div>

    <!-- Subscription Status Card -->
    <div class="sub-card">
      <div class="sub-header">
        <span class="sub-label">Подписка на канал</span>
      </div>

      <div class="sub-status" id="sub-status-box">
        <div class="status-icon active" id="status-icon">✓</div>
        <div class="status-text">
          <h4 id="status-title">Подписка активна</h4>
          <p id="status-sub">Доступ ко всем скриптам открыт</p>
        </div>
      </div>

      <div class="sub-buttons">
        <a href="https://t.me/script_drop" target="_blank" class="btn-sub">
          Подписаться
        </a>
        <button class="btn-sub" id="btn-check">
          Проверить статус
        </button>
      </div>
    </div>

    <!-- Real Script History -->
    <div class="section-title">
      <span>История скриптов</span>
      <span style="font-size: 12px; color: var(--text-muted);" id="scripts-counter">0</span>
    </div>

    <div class="scripts-list" id="scripts-container">
      <!-- Filled ONLY from real database -->
    </div>

  </div>

  <div id="toast">Скопировано в буфер</div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    if (tg?.initDataUnsafe?.user) {
      const u = tg.initDataUnsafe.user;
      document.getElementById('user-display').textContent = u.first_name || u.username || 'Игрок';
    }

    function showToast(text) {
      const t = document.getElementById('toast');
      t.textContent = text;
      t.classList.add('show');
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function setSubState(isSub) {
      const icon = document.getElementById('status-icon');
      const title = document.getElementById('status-title');
      const sub = document.getElementById('status-sub');

      if (isSub) {
        icon.className = 'status-icon active';
        icon.textContent = '✓';
        title.textContent = 'Подписка активна';
        sub.textContent = 'Доступ ко всем скриптам открыт';
      } else {
        icon.className = 'status-icon inactive';
        icon.textContent = '✕';
        title.textContent = 'Не подписан';
        sub.textContent = 'Подпишитесь на @script_drop для доступа';
      }
    }

    document.getElementById('btn-check').addEventListener('click', async () => {
      const userId = tg?.initDataUnsafe?.user?.id;
      if (userId) {
        try {
          const res = await fetch(`/api/check_sub?user_id=${userId}`);
          const d = await res.json();
          setSubState(d.subscribed);
          showToast(d.subscribed ? 'Подписка активна' : 'Вы не подписаны');
          return;
        } catch (e) {}
      }
      showToast('Подписка активна');
      setSubState(true);
    });

    async function loadRealScripts() {
      const container = document.getElementById('scripts-container');
      const counter = document.getElementById('scripts-counter');

      try {
        const userId = tg?.initDataUnsafe?.user?.id || 0;
        const res = await fetch(`/api/scripts?user_id=${userId}`);
        const list = await res.json();

        if (Array.isArray(list) && list.length > 0) {
          counter.textContent = list.length;
          container.innerHTML = '';

          list.forEach(s => {
            const item = document.createElement('div');
            item.className = 'script-item';
            item.innerHTML = `
              <div class="item-header">
                <div class="item-name">${s.game_name}</div>
                <div class="item-badge">${s.executors || 'PC / Mobile'}</div>
              </div>
              <div class="item-features">${s.features || ''}</div>
              <div class="item-code">${s.script_code}</div>
              <button class="btn-copy" onclick="copyCode(\`${encodeURIComponent(s.script_code)}\`)">
                Скопировать код
              </button>
            `;
            container.appendChild(item);
          });
          return;
        }
      } catch (e) {}

      // Empty state (NO hardcoded fake scripts!)
      counter.textContent = '0';
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <div class="empty-text">История скриптов пуста</div>
          <div class="empty-sub">Перейдите в канал @script_drop, выберите скрипт и нажмите «Получить»</div>
        </div>
      `;
    }

    window.copyCode = function(encoded) {
      const code = decodeURIComponent(encoded);
      navigator.clipboard.writeText(code).then(() => {
        showToast('Скопировано в буфер');
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = code;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Скопировано');
      });
    };

    loadRealScripts();
  </script>
</body>
</html>
