<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Script Drop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0e0e11;
      --card-bg: #18181c;
      --card-border: #26262b;
      --text: #ffffff;
      --text-muted: #8e8e93;
      --accent: #22c55e;
      --accent-glow: rgba(34, 197, 94, 0.25);
      --danger: #ef4444;
      --btn-bg: #242429;
      --btn-hover: #2c2c33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 60px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-top: 4px;
    }

    .app-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .user-badge {
      font-size: 13px;
      color: var(--text-muted);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 20px;
    }

    /* Channel Banner */
    .channel-banner {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .channel-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .channel-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .btn-channel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #ffffff;
      color: #000000;
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      border-radius: 12px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.15s;
    }

    .btn-channel:active {
      opacity: 0.85;
      transform: scale(0.98);
    }

    /* Subscription Card */
    .sub-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .sub-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .sub-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sub-status {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      margin-bottom: 12px;
    }

    /* Animated Checkmark SVG & Icon */
    .status-icon {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.3s ease;
    }

    .status-icon.active {
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.35);
      animation: pulseGlow 2.5s infinite;
    }

    .status-icon.inactive {
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .checkmark-svg {
      width: 24px;
      height: 24px;
      display: block;
    }

    .checkmark-circle {
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      stroke-width: 3.5;
      stroke-miterlimit: 10;
      stroke: var(--accent);
      fill: none;
      animation: strokeCircle 0.55s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }

    .checkmark-check {
      transform-origin: 50% 50%;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      stroke-width: 3.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke: var(--accent);
      fill: none;
      animation: strokeCheck 0.35s cubic-bezier(0.65, 0, 0.45, 1) 0.4s forwards;
    }

    @keyframes strokeCircle {
      100% { stroke-dashoffset: 0; }
    }

    @keyframes strokeCheck {
      100% { stroke-dashoffset: 0; }
    }

    .cross-svg {
      width: 24px;
      height: 24px;
      display: block;
    }

    .cross-circle {
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      stroke-width: 3.5;
      stroke: var(--danger);
      fill: none;
      animation: strokeCircle 0.5s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }

    .cross-line {
      stroke-dasharray: 30;
      stroke-dashoffset: 30;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke: var(--danger);
      animation: strokeCheck 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.35s forwards;
    }

    .status-icon.spin {
      animation: rotateIcon 0.8s linear infinite !important;
    }

    @keyframes rotateIcon {
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      50% { box-shadow: 0 0 12px 3px rgba(34, 197, 94, 0.25); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .status-text h4 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .status-text p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .sub-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-sub {
      flex: 1;
      background: var(--btn-bg);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, transform 0.15s;
    }

    .btn-sub:active {
      background: var(--btn-hover);
      transform: scale(0.97);
    }

    /* Tabs Navigation */
    .tabs-nav {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tab-btn.active {
      background: var(--btn-bg);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .tab-btn:active {
      transform: scale(0.97);
    }

    .tab-badge {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 7px;
      border-radius: 10px;
      color: var(--text-muted);
    }

    .tab-badge.hot {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      font-weight: 700;
    }

    .tab-btn.active .tab-badge:not(.hot) {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    /* Scripts Section & Animation */
    .section-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .scripts-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @keyframes cascadeIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .script-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      animation: cascadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) backwards;
      transition: transform 0.15s, border-color 0.15s;
    }

    .script-item:active {
      transform: scale(0.99);
    }

    .item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .item-name {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .item-badge {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .item-badge.hot-badge {
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .item-features {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 10px;
      white-space: pre-line;
    }

    .item-code {
      background: #09090b;
      border: 1px solid #1e1e24;
      border-radius: 8px;
      padding: 8px 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: #94a3b8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 10px;
    }

    .btn-copy {
      width: 100%;
      background: var(--btn-bg);
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      padding: 9px;
      border-radius: 9px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, transform 0.15s;
    }

    .btn-copy:active {
      background: var(--btn-hover);
      transform: scale(0.98);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 36px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      color: var(--text-muted);
      animation: cascadeIn 0.3s ease;
    }

    .empty-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .empty-text {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #fff;
    }

    .empty-sub {
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 14px;
    }

    .btn-empty-top {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--btn-bg);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: transform 0.15s;
    }

    .btn-empty-top:active {
      transform: scale(0.96);
    }

    /* Floating Rewind / Scroll to Top Button */
    #btn-rewind {
      position: fixed;
      bottom: 22px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(30, 30, 36, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px) scale(0.9);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 900;
    }

    #btn-rewind.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    #btn-rewind:active {
      transform: scale(0.92);
      background: rgba(45, 45, 55, 0.95);
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: #ffffff;
      color: #000000;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 1000;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="app-title">Script Drop</div>
      <div class="user-badge" id="user-display">Игрок</div>
    </div>

    <!-- Official Channel Card -->
    <div class="channel-banner">
      <div class="channel-title">Канал со скриптами</div>
      <div class="channel-desc">Свежие релизы, читы и скрипты для Roblox без вирусов и рекламы.</div>
      <a href="https://t.me/script_drop" target="_blank" class="btn-channel">
        Перейти в @script_drop ↗
      </a>
    </div>

    <!-- Subscription Status Card -->
    <div class="sub-card">
      <div class="sub-header">
        <span class="sub-label">Подписка на канал</span>
      </div>

      <div class="sub-status" id="sub-status-box">
        <div class="status-icon active" id="status-icon">
          <!-- Animated Checkmark SVG -->
          <svg class="checkmark-svg" viewBox="0 0 52 52">
            <circle class="checkmark-circle" cx="26" cy="26" r="23" />
            <path class="checkmark-check" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
          </svg>
        </div>
        <div class="status-text">
          <h4 id="status-title">Подписка активна</h4>
          <p id="status-sub">Доступ ко всем скриптам открыт</p>
        </div>
      </div>

      <div class="sub-buttons">
        <a href="https://t.me/script_drop" target="_blank" class="btn-sub">
          Подписаться
        </a>
        <button class="btn-sub" id="btn-check">
          Проверить статус
        </button>
      </div>
    </div>

    <!-- Navigation Tabs: History & Best Scripts -->
    <div class="tabs-nav">
      <button class="tab-btn active" id="tab-my" onclick="switchTab('my')">
        <span>📋 Моя история</span>
        <span class="tab-badge" id="tab-my-count">0</span>
      </button>
      <button class="tab-btn" id="tab-top" onclick="switchTab('top')">
        <span>⭐ Лучшие скрипты</span>
        <span class="tab-badge hot">HOT</span>
      </button>
    </div>

    <!-- Scripts List Section -->
    <div class="section-title">
      <span id="section-heading">История скриптов</span>
      <span style="font-size: 12px; color: var(--text-muted);" id="scripts-counter">0</span>
    </div>

    <div class="scripts-list" id="scripts-container">
      <!-- Injected dynamically -->
    </div>

  </div>

  <!-- Floating Rewind / Scroll To Top Button -->
  <button id="btn-rewind" onclick="rewindToTop()">
    <span>▲</span> Наверх
  </button>

  <div id="toast">Скопировано в буфер</div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    if (tg?.initDataUnsafe?.user) {
      const u = tg.initDataUnsafe.user;
      document.getElementById('user-display').textContent = u.first_name || u.username || 'Игрок';
    }

    function showToast(text) {
      const t = document.getElementById('toast');
      t.textContent = text;
      t.classList.add('show');
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    // Animated Checkmark / Status Renderer
    function renderStatusIcon(isSub) {
      const icon = document.getElementById('status-icon');
      const title = document.getElementById('status-title');
      const sub = document.getElementById('status-sub');

      icon.classList.remove('spin');

      if (isSub) {
        icon.className = 'status-icon active';
        icon.innerHTML = `
          <svg class="checkmark-svg" viewBox="0 0 52 52">
            <circle class="checkmark-circle" cx="26" cy="26" r="23" />
            <path class="checkmark-check" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
          </svg>
        `;
        title.textContent = 'Подписка активна';
        sub.textContent = 'Доступ ко всем скриптам открыт';
      } else {
        icon.className = 'status-icon inactive';
        icon.innerHTML = `
          <svg class="cross-svg" viewBox="0 0 52 52">
            <circle class="cross-circle" cx="26" cy="26" r="23" />
            <path class="cross-line" d="M16 16 L36 36" />
            <path class="cross-line" d="M36 16 L16 36" />
          </svg>
        `;
        title.textContent = 'Не подписан';
        sub.textContent = 'Подпишитесь на @script_drop для доступа';
      }
    }

    // Check Status Button with Spin Animation
    document.getElementById('btn-check').addEventListener('click', async () => {
      const icon = document.getElementById('status-icon');
      icon.innerHTML = `<svg viewBox="0 0 24 24" width="22" height="22" stroke="var(--text-muted)" stroke-width="2.5" fill="none"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"/><path d="M12 2 A10 10 0 0 1 22 12" /></svg>`;
      icon.classList.add('spin');

      const userId = tg?.initDataUnsafe?.user?.id;
      let isSubscribed = true;

      if (userId) {
        try {
          const res = await fetch(`/api/check_sub?user_id=${userId}`);
          const d = await res.json();
          isSubscribed = !!d.subscribed;
        } catch (e) {
          isSubscribed = true;
        }
      }

      setTimeout(() => {
        renderStatusIcon(isSubscribed);
        showToast(isSubscribed ? 'Подписка активна ✓' : 'Вы не подписаны');
      }, 400);
    });

    // Rewind / Scroll to Top logic
    window.addEventListener('scroll', () => {
      const btn = document.getElementById('btn-rewind');
      if (window.scrollY > 140) {
        btn.classList.add('visible');
      } else {
        btn.classList.remove('visible');
      }
    });

    function rewindToTop() {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    }

    // Curated Top Scripts
    const TOP_SCRIPTS = [
      {
        game_name: 'Blox Fruits',
        badge: '⭐ 9.9 | 🔥 150k+ онлайн',
        executors: 'ПК и Мобильные (Delta, Arceus X, Fluxus, Codex, Solara)',
        features: '• ESP (Подсветка игроков, сундуков и фруктов)\n• Auto Farm Level & Mastery (Авто-фарм уровня)\n• Auto Raid & Dungeon (Прохождение рейдов)\n• Teleport, Safe Zone, WalkSpeed',
        script_code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/JustParadozCode/LinkHive---Scripts/refs/heads/main/script.lua"))()'
      },
      {
        game_name: 'Blade Ball',
        badge: '⭐ 9.8 | ⚔️ Undetected',
        executors: 'ПК и Мобильные (Delta, Arceus X, Fluxus, Codex, Solara)',
        features: '• 100% Auto Parry (Авто-парирование мяча)\n• Curve Ball & Fast Spam Ability\n• Visual Target Tracer (Траектория мяча)\n• WalkSpeed & JumpPower',
        script_code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/JustParadozCode/LinkHive---Scripts/refs/heads/main/script.lua"))()'
      },
      {
        game_name: 'Steal an Egg',
        badge: '⭐ 9.7 | 🥚 Топ релиз',
        executors: 'ПК и Мобильные (Delta, Arceus X, Fluxus, Codex, Solara)',
        features: '• Auto Steal Egg (Мгновенный сбор яиц)\n• Instant Hatch & Open Eggs (Быстрое открытие)\n• WalkSpeed, Fly, Safe Zone\n• ESP на редкие яйца',
        script_code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/JustParadozCode/LinkHive---Scripts/refs/heads/main/script.lua"))()'
      },
      {
        game_name: 'Rivals',
        badge: '⭐ 9.9 | 🎯 Hitbox & Aim',
        executors: 'ПК (Solara, Wave) и Мобильные (Delta, Codex)',
        features: '• Silent Aim & Triggerbot (Авто-стрельба)\n• Player Box ESP & Skeleton\n• Infinite Ammo & No Recoil (Без отдачи)\n• SpeedHack & Fly',
        script_code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/JustParadozCode/LinkHive---Scripts/refs/heads/main/script.lua"))()'
      },
      {
        game_name: 'Murder Mystery 2',
        badge: '⭐ 9.6 | 🔪 Auto Farm',
        executors: 'ПК и Мобильные (Delta, Arceus X, Fluxus, Codex, Solara)',
        features: '• Auto Collect Coins (Фарм монет)\n• Role ESP (Подсветка Sheriff & Murderer)\n• Silent Aim (Мгновенное попадание)\n• Teleport to Gun / Safe Spot',
        script_code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/JustParadozCode/LinkHive---Scripts/refs/heads/main/script.lua"))()'
      }
    ];

    let myScripts = [];
    let currentTab = 'my';

    async function fetchUserScripts() {
      try {
        const userId = tg?.initDataUnsafe?.user?.id || 0;
        const res = await fetch(`/api/scripts?user_id=${userId}`);
        const data = await res.json();
        if (Array.isArray(data)) {
          myScripts = data;
        }
      } catch (e) {
        myScripts = [];
      }
      document.getElementById('tab-my-count').textContent = myScripts.length;
    }

    function renderScripts(list, isTopView = false) {
      const container = document.getElementById('scripts-container');
      const counter = document.getElementById('scripts-counter');
      const heading = document.getElementById('section-heading');

      heading.textContent = isTopView ? 'Лучшие скрипты' : 'История скриптов';
      counter.textContent = list.length;
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <div class="empty-text">История скриптов пуста</div>
            <div class="empty-sub">Вы ещё не получали скриптов через бота. Выберите скрипт из лучших или в канале!</div>
            <button class="btn-empty-top" onclick="switchTab('top')">
              ⭐ Посмотреть лучшие скрипты
            </button>
          </div>
        `;
        return;
      }

      list.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = 'script-item';
        item.style.animationDelay = `${idx * 0.05}s`;

        const badgeHtml = s.badge
          ? `<div class="item-badge hot-badge">${s.badge}</div>`
          : `<div class="item-badge">${s.executors || 'PC / Mobile'}</div>`;

        item.innerHTML = `
          <div class="item-header">
            <div class="item-name">${s.game_name}</div>
            ${badgeHtml}
          </div>
          <div class="item-features">${s.features || ''}</div>
          <div class="item-code">${s.script_code}</div>
          <button class="btn-copy" onclick="copyCode(\`${encodeURIComponent(s.script_code)}\`)">
            📋 Скопировать код
          </button>
        `;
        container.appendChild(item);
      });
    }

    function switchTab(tab) {
      currentTab = tab;
      const tabMy = document.getElementById('tab-my');
      const tabTop = document.getElementById('tab-top');

      if (tab === 'my') {
        tabMy.classList.add('active');
        tabTop.classList.remove('active');
        renderScripts(myScripts, false);
      } else {
        tabTop.classList.add('active');
        tabMy.classList.remove('active');
        renderScripts(TOP_SCRIPTS, true);
      }

      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
    }

    window.copyCode = function(encoded) {
      const code = decodeURIComponent(encoded);
      navigator.clipboard.writeText(code).then(() => {
        showToast('Скопировано в буфер ✓');
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = code;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Скопировано ✓');
      });
    };

    // Initial boot
    async function init() {
      await fetchUserScripts();
      // If user has history, start on 'my', else show 'top'
      if (myScripts.length > 0) {
        switchTab('my');
      } else {
        switchTab('top');
      }
    }

    init();
  </script>
</body>
</html>
